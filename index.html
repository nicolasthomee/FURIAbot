<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURIAbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('./imagens/wallpaper3.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen px-4">
    <div class="bg-white shadow-lg rounded-xl p-6 sm:p-8 max-w-md sm:max-w-lg text-center">

        <!-- Logo -->
        <div class="mb-6">
            <img src="./imagens/logo.png" alt="Logo FURIA" class="w-24 h-24 sm:w-36 sm:h-36 mx-auto">
        </div>

        <!-- Título -->
        <h1 class="text-xl sm:text-2xl font-bold text-gray-800 mb-4">Bot da FURIA no Telegram</h1>
        
        <!-- Descrição -->
        <p class="text-gray-600 mb-6 text-sm sm:text-base">
            Receba as últimas <strong>notícias</strong>, <strong>resultados</strong>, <strong>status ao vivo</strong>, <strong>próximas partidas</strong> e até <strong>simule a torcida</strong> direto no seu Telegram! 
            Uma experiência completa para todo fã da FURIA.
        </p>

        <!-- Botão -->
        <a href="https://t.me/furiacs_2025_bot" target="_blank" class="bg-black text-white px-4 sm:px-6 py-2 sm:py-3 rounded-xl shadow hover:bg-gray-800 transition">
            👉 Abrir no Telegram
        </a>
    </div>
</body>
</html>
